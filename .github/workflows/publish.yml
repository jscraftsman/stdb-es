name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Dry-run checks or real publication'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      tag:
        description: 'npm dist-tag to apply'
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta
      version:
        description: 'Expected package.json version (optional guard)'
        required: false
        type: string

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm (${{ inputs.action }})
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write

    env:
      NODE_VERSION: 24.22.3
      INPUT_ACTION: ${{ inputs.action }}
      INPUT_TAG: ${{ inputs.tag }}
      EXPECTED_VERSION: ${{ inputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify npm CLI supports trusted publishing
        run: |
          set -euo pipefail
          node - <<'NODE'
          const npmVersion = process.versions.npm;
          const [major = 0, minor = 0, patch = 0] = npmVersion.split('.').map(Number);
          const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          if (!supported) {
            console.error(`npm 11.5.1+ is required for trusted publishing; found ${npmVersion}`);
            process.exit(1);
          }
          console.log(`npm ${npmVersion}`);
          NODE

      - name: Guard release inputs
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publishing is only allowed from $DEFAULT_BRANCH"
            exit 1
          fi
          case "$INPUT_ACTION" in
            dry-run|publish) ;;
            *) echo "::error::Unknown action: $INPUT_ACTION"; exit 1 ;;
          esac
          case "$INPUT_TAG" in
            latest|next|beta) ;;
            *) echo "::error::Unknown dist-tag: $INPUT_TAG"; exit 1 ;;
          esac
          if [ -n "$EXPECTED_VERSION" ]; then
            actual="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
            if [ "$actual" != "$EXPECTED_VERSION" ]; then
              echo "::error::Expected version $EXPECTED_VERSION but package.json is $actual"
              exit 1
            fi
            echo "Version guard passed: $actual"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
            echo "Using NPM_TOKEN from the repository secret."
          else
            echo "NPM_TOKEN is not set; using npm trusted publishing (OIDC)."
          fi

      - name: Build and typecheck
        run: |
          npm run build
          npm run typecheck
          npm run example:typecheck
          npm run example:set:counter:typecheck

      - name: Unit tests
        run: npm test

      - name: Fresh-app package check
        run: npm run check:pack

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: npm publish (dry run)
        if: env.INPUT_ACTION == 'dry-run'
        run: npm publish --dry-run --access public --tag "$INPUT_TAG"

      - name: npm publish
        if: env.INPUT_ACTION == 'publish'
        run: npm publish --access public --tag "$INPUT_TAG"
