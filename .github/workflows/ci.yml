name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.22.3
  SPACETIME_VERSION: 2.16.3

jobs:
  gate:
    name: build, typecheck, unit, pack, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install pinned SpacetimeDB CLI
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/spacetime/bin"
          archive="$RUNNER_TEMP/spacetime-${SPACETIME_VERSION}.tar.gz"
          mkdir -p "$bin"
          curl -sSfL \
            "https://github.com/clockworklabs/SpacetimeDB/releases/download/v${SPACETIME_VERSION}/spacetime-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$archive"

          echo "Archive contents:"
          tar -tzf "$archive"
          tar -xzf "$archive" -C "$bin"

          echo "Extracted files:"
          find "$bin" -maxdepth 2 -type f -printf '%P\n' | sort

          if [ ! -f "$bin/spacetime" ] && [ -f "$bin/spacetimedb-cli" ]; then
            mv "$bin/spacetimedb-cli" "$bin/spacetime"
          fi

          # The CLI resolves its sibling server binary as
          # spacetimedb-standalone. Some artifacts use the shorter name, so
          # normalize either spelling to the name the CLI actually looks for.
          if [ ! -f "$bin/spacetimedb-standalone" ]; then
            standalone="$(find "$bin" -maxdepth 2 -type f \( -name 'spacetimedb-standalone' -o -name 'spacetime-standalone' \) -print -quit)"
            if [ -n "$standalone" ] && [ "$standalone" != "$bin/spacetimedb-standalone" ]; then
              mv "$standalone" "$bin/spacetimedb-standalone"
            fi
          fi

          if [ -f "$bin/spacetimedb-standalone" ] && [ ! -e "$bin/spacetime-standalone" ]; then
            ln -s spacetimedb-standalone "$bin/spacetime-standalone"
          fi

          for file in "$bin/spacetime" "$bin/spacetimedb-standalone"; do
            if [ -f "$file" ]; then
              chmod +x "$file"
            fi
          done

          if [ ! -x "$bin/spacetime" ]; then
            echo "::error::spacetime CLI binary not found after extracting v${SPACETIME_VERSION}"
            exit 1
          fi
          if [ ! -x "$bin/spacetimedb-standalone" ]; then
            echo "::error::spacetimedb-standalone server binary not found after extracting v${SPACETIME_VERSION}"
            exit 1
          fi

          echo "$bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          spacetime --version

      - name: Install dependencies
        run: npm ci

      - name: Build and typecheck
        run: |
          npm run build
          npm run typecheck
          npm run example:react-counter:typecheck
          npm run example:phaser-counter:typecheck

      - name: Unit tests
        run: npm test

      - name: Fresh-app package check
        run: npm run check:pack

      - name: Start disposable local server
        run: |
          set -euo pipefail
          # The CLI seeds a built-in `local` server at 127.0.0.1:3000, so a plain
          # `server add` conflicts with it. Replace any existing entry first so
          # this step is idempotent on fresh and reused runners alike.
          spacetime server remove local -y >/dev/null 2>&1 || true
          spacetime server add local --url http://127.0.0.1:3000 --no-fingerprint
          spacetime start --in-memory --non-interactive \
            > "$RUNNER_TEMP/spacetime-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/spacetime-server.pid"
          for _ in $(seq 1 60); do
            if spacetime server ping local >/dev/null 2>&1; then
              echo "local server ready"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/spacetime-server.log"
          exit 1

      - name: Live publish smoke
        run: npm run smoke

      - name: Integration kit smoke
        run: npm run smoke:integration

      - name: React counter example integration tests
        run: npm run example:react-counter:test:integration

      - name: Phaser counter example integration tests
        run: npm run example:phaser-counter:test:integration

      - name: Stop disposable local server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/spacetime-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/spacetime-server.pid")" 2>/dev/null || true
          fi

      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/spacetime-server.log" || true

  version-bump:
    name: Version bump (Commitizen)
    needs: gate
    # Only release from the default branch, and never from a bump commit itself
    # (the `[skip ci]` guard also stops GitHub from re-running CI on our push).
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out (full history and tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Commitizen
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install commitizen
          cz version --commitizen

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Log & detect version
        id: version
        run: |
          set -euo pipefail

          echo "Git history:"
          git log -n 5 --oneline

          CURRENT_PUBLISH_VERSION="$(cz version -p)"

          # Commitizen exits 3 (no commits) or 21 (no eligible commits) when
          # there is nothing to release; both mean "skip", not "fail".
          set +e
          NEXT_PUBLISH_VERSION="$(cz bump --get-next --dry-run 2>/dev/null)"
          CZ_EXIT_CODE=$?
          set -e
          case "$CZ_EXIT_CODE" in
            0) ;;
            3|21) NEXT_PUBLISH_VERSION="" ;;
            *)
              echo "::error::cz bump --get-next failed with exit code $CZ_EXIT_CODE"
              exit "$CZ_EXIT_CODE"
              ;;
          esac

          HAS_NEW_VERSION=false
          if [ -n "$NEXT_PUBLISH_VERSION" ] && [ "$CURRENT_PUBLISH_VERSION" != "$NEXT_PUBLISH_VERSION" ]; then
            HAS_NEW_VERSION=true
          fi

          echo "Current version: $CURRENT_PUBLISH_VERSION"
          echo "Next version: ${NEXT_PUBLISH_VERSION:-<none>}"
          echo "Has new version: $HAS_NEW_VERSION"

          echo "current_version=$CURRENT_PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "has_new_version=$HAS_NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: No version bump needed
        if: steps.version.outputs.has_new_version != 'true'
        run: echo "No conventional commits requiring a release since the latest tag."

      - name: Write next version to package.json
        if: steps.version.outputs.has_new_version == 'true'
        env:
          NEXT_PUBLISH_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          NEXT_PUBLISH_VERSION="$NEXT_PUBLISH_VERSION" node - <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = process.env.NEXT_PUBLISH_VERSION;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          echo "package.json version set to $NEXT_PUBLISH_VERSION:"
          git diff -- package.json

      - name: Commit package.json version change
        if: steps.version.outputs.has_new_version == 'true'
        run: |
          set -euo pipefail
          git add package.json
          git commit -m "[skip ci] Update version in package.json"

      - name: Bump version, changelog and git tag
        if: steps.version.outputs.has_new_version == 'true'
        run: |
          set -euo pipefail
          echo "Git history before version bump:"
          git log -n 5 --oneline

          # Commitizen owns .cz.json, CHANGELOG.md and the annotated git tag.
          cz bump --yes --annotated-tag --check-consistency

          echo "Git history after version bump:"
          git log -n 5 --oneline
          echo "Tags:"
          git tag -l

      - name: Verify bump result
        if: steps.version.outputs.has_new_version == 'true'
        env:
          NEXT_PUBLISH_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          actual="$(node -p "require('./package.json').version")"
          if [ "$actual" != "$NEXT_PUBLISH_VERSION" ]; then
            echo "::error::Expected package.json version $NEXT_PUBLISH_VERSION but found $actual"
            exit 1
          fi
          tag="$(git tag --points-at HEAD)"
          if [ "$tag" != "$NEXT_PUBLISH_VERSION" ]; then
            echo "::error::Expected tag $NEXT_PUBLISH_VERSION on HEAD but found '${tag:-<none>}'"
            exit 1
          fi
          echo "Verified version $actual and tag $tag on HEAD."
          git status --short

      - name: Push version bump commit and tag
        if: steps.version.outputs.has_new_version == 'true'
        env:
          NEXT_PUBLISH_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "refs/tags/$NEXT_PUBLISH_VERSION"
